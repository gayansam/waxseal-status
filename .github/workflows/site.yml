name: Static Site CI
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  repository_dispatch:

jobs:
  site:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: upptime/status-page@v1.17.0
        env:
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}
