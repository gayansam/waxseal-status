name: Graphs CI
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  graphs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: upptime/graphs@v1.2.18
        env:
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}
